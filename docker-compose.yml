version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: luxegrocer-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - luxegrocer-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: luxegrocer-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/luxegrocer
      - JWT_SECRET=luxegrocer-super-secret-jwt-key-2026
      - NODE_ENV=production
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/usr/src/app/uploads
      - ./backend/db.json:/usr/src/app/db.json
    networks:
      - luxegrocer-network

volumes:
  mongo-data:
    driver: local

networks:
  luxegrocer-network:
    driver: bridge
